<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D2K1 Nöroanatomi Çıkmış Soru Bankası</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased flex flex-col">

  <!-- Üst Bar & Skor Paneli -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-sky-500/10 text-sky-400 rounded-xl border border-sky-500/20">
          <i data-lucide="brain" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white leading-tight">D2K1 Soru Havuzu</h1>
          <p class="text-xs text-slate-400" id="headerSubtitle">Veriler yükleniyor...</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-4 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800 text-sm" id="statsPanel">
          <div class="flex items-center gap-2">
            <span class="text-slate-400">Çözülen:</span>
            <span id="statProgress" class="font-bold text-white">0 / 0</span>
          </div>
          <div class="h-4 w-px bg-slate-700"></div>
          <div class="flex items-center gap-2">
            <span class="text-slate-400">Başarı:</span>
            <span id="statAccuracy" class="font-bold text-emerald-400">%0</span>
          </div>
        </div>

        <label class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold cursor-pointer border border-slate-700 flex items-center gap-1.5 transition">
          <i data-lucide="files" class="w-4 h-4 text-sky-400"></i> JSON Ekle
          <input type="file" id="filePicker" accept=".json" multiple class="hidden">
        </label>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 w-full flex-1 flex flex-col gap-6">

    <!-- 1. YIL SEÇİM ÇUBUĞU -->
    <section class="flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Sınav Yılı / Mod:</span>
        <span id="loadingIndicator" class="text-xs text-sky-400 hidden flex items-center gap-1">
          <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Yükleniyor...
        </span>
      </div>
      <div class="flex items-center gap-2 overflow-x-auto pb-1" id="yearTabsContainer">
        <!-- Yıllar buraya otomatik gelecek -->
      </div>
    </section>

    <!-- 2. FİLTRELER VE ARAMA -->
    <section class="bg-slate-800/60 p-4 rounded-2xl border border-slate-700/60 flex flex-col gap-3">
      <div class="flex flex-col md:flex-row gap-3 items-center justify-between">
        <div class="relative w-full md:w-64 lg:w-80">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="Soru, traktus veya nükleus ara..." 
            class="w-full pl-9 pr-4 py-2 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-sky-500">
        </div>

        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
          <!-- Ders Filtresi -->
          <select id="subjectFilter" onchange="setSubjectFilter(this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-sky-500 cursor-pointer">
            <option value="Tümü">Tüm Dersler</option>
          </select>

          <!-- Durum Filtreleri -->
          <div class="flex bg-slate-900 rounded-lg border border-slate-700 overflow-hidden">
            <button onclick="setStatusFilter('all')" id="btnFilterAll" class="px-3 py-1.5 text-xs font-medium bg-sky-500 text-white transition">Tümü</button>
            <button onclick="setStatusFilter('wrong')" id="btnFilterWrong" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:bg-slate-700 transition border-l border-slate-700">Yanlışlar</button>
            <button onclick="setStatusFilter('starred')" id="btnFilterStarred" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:bg-slate-700 transition border-l border-slate-700">Favoriler</button>
          </div>

          <!-- Ne Çıkarsa Bahtıma Butonu -->
          <button onclick="pickRandomQuestion()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 hover:bg-amber-400 text-amber-950 transition flex items-center gap-1.5 shadow-lg shadow-amber-500/20">
            <i data-lucide="dices" class="w-4 h-4"></i> Bahtıma Ne Çıkarsa
          </button>
        </div>
      </div>

      <!-- Alt Konu Hapları -->
      <div class="flex flex-wrap gap-1.5 pt-2 border-t border-slate-700/40" id="topicChips"></div>
    </section>

    <!-- RASTGELE MOD BİLDİRİMİ -->
    <div id="randomModeBanner" class="hidden bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 flex items-center justify-between">
      <div class="flex items-center gap-2 text-amber-300 text-sm font-semibold">
        <i data-lucide="dices" class="w-5 h-5"></i>
        Ne Çıkarsa Bahtıma Modu Aktif (Rastgele 1 Soru Gösteriliyor)
      </div>
      <button onclick="exitRandomMode()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-white text-xs rounded-lg transition border border-slate-600">
        Tüm Sorulara Dön
      </button>
    </div>

    <!-- 3. SORU LİSTESİ -->
    <div id="questionsContainer" class="flex flex-col gap-6"></div>

  </main>

  <script>
    let globalQuestions = []; 
    let displayedQuestions = []; 
    
    let currentYearKey = 'Tümü';
    let currentStatusFilter = 'all';
    let currentSubjectFilter = 'Tümü';
    let currentTopicFilter = 'Tümü';
    let searchQuery = '';
    let isRandomMode = false;

    let userAnswers = JSON.parse(localStorage.getItem('d2k1_answers') || '{}');
    let starredQuestions = JSON.parse(localStorage.getItem('d2k1_starred') || '[]');

    function saveState() {
      localStorage.setItem('d2k1_answers', JSON.stringify(userAnswers));
      localStorage.setItem('d2k1_starred', JSON.stringify(starredQuestions));
      updateStats();
    }

    // SAYFA AÇILDIĞINDA DATA/ KLASÖRÜNDEN OTOMATİK ÇEKME MOTORU
    async function initApp() {
      const loader = document.getElementById('loadingIndicator');
      loader.classList.remove('hidden');

      try {
        const res = await fetch('data/index.json');
        if (!res.ok) throw new Error("data/index.json bulunamadı.");
        const indexList = await res.json();

        // index.json içindeki tüm dosyaları paralel olarak çekip birleştir
        const filePromises = indexList.map(item => 
          fetch(item.dosya)
            .then(r => r.ok ? r.json() : [])
            .catch(() => [])
        );

        const results = await Promise.all(filePromises);
        globalQuestions = results.flat();

        if (globalQuestions.length > 0) {
          setupPool();
        } else {
          showEmptyState("data/ klasöründeki dosyaların içi boş veya okunamadı.");
        }
      } catch (err) {
        console.warn("data/index.json otomatik okunamadı (yerel mod veya CORS):", err);
        showEmptyState("data havuzundan otomatik yüklenemedi. Sağ üstteki 'JSON Ekle' butonundan dosyalarınızı seçebilirsiniz.");
      } finally {
        loader.classList.add('hidden');
        lucide.createIcons();
      }
    }

    // MANUEL DOSYA YÜKLEME DESTEĞİ
    document.getElementById('filePicker').addEventListener('change', async function(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      let newQuestions = [];
      for (let file of files) {
        try {
          const text = await readFileAsync(file);
          const parsed = JSON.parse(text);
          newQuestions = newQuestions.concat(parsed);
        } catch (err) {
          console.error(`${file.name} okunamadı.`);
        }
      }

      if (newQuestions.length > 0) {
        // Zaten var olan sorularla birleştir (id çakışmasını engelle)
        const existingIds = new Set(globalQuestions.map(q => q.id));
        const filteredNew = newQuestions.filter(q => !existingIds.has(q.id));
        globalQuestions = globalQuestions.concat(filteredNew.length > 0 ? filteredNew : newQuestions);
        setupPool();
      }
    });

    function readFileAsync(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = e => reject(e);
        reader.readAsText(file);
      });
    }

    function setupPool() {
      currentYearKey = 'Tümü'; 
      isRandomMode = false;
      renderYearTabs();
      populateSubjectDropdown();
      applyFilters();
    }

    function renderYearTabs() {
      // Yılları tespit et ve sırala
      const years = [...new Set(globalQuestions.map(q => String(q.yil)))].sort().reverse();
      const container = document.getElementById('yearTabsContainer');
      let html = '';
      
      const isAllSelected = currentYearKey === 'Tümü';
      html += `
        <button onclick="selectYear('Tümü')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 ${
          isAllSelected ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'
        }">
          <i data-lucide="layers" class="w-3.5 h-3.5"></i> Tüm Çıkmışlar (Karma)
        </button>
      `;

      years.forEach(y => {
        const isSelected = currentYearKey === y;
        html += `
          <button onclick="selectYear('${y}')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 ${
            isSelected ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'
          }">
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${y}
          </button>
        `;
      });

      container.innerHTML = html;
      lucide.createIcons();
    }

    function selectYear(year) {
      currentYearKey = year;
      isRandomMode = false; 
      renderYearTabs();
      applyFilters();
    }

    function populateSubjectDropdown() {
      const subjects = [...new Set(globalQuestions.map(q => q.ders || 'Diğer'))].sort();
      const select = document.getElementById('subjectFilter');
      let options = `<option value="Tümü">Tüm Dersler</option>`;
      subjects.forEach(s => {
        options += `<option value="${s}">${s}</option>`;
      });
      select.innerHTML = options;
      select.value = currentSubjectFilter;
    }

    function setSubjectFilter(val) {
      currentSubjectFilter = val;
      currentTopicFilter = 'Tümü'; 
      isRandomMode = false;
      applyFilters();
    }

    function setStatusFilter(type) {
      currentStatusFilter = type;
      isRandomMode = false;
      const btns = ['btnFilterAll', 'btnFilterWrong', 'btnFilterStarred'];
      btns.forEach(id => {
        document.getElementById(id).className = "px-3 py-1.5 text-xs font-medium text-slate-300 hover:bg-slate-700 transition border-l border-slate-700";
      });
      let activeId = type === 'all' ? 'btnFilterAll' : (type === 'wrong' ? 'btnFilterWrong' : 'btnFilterStarred');
      document.getElementById(activeId).className = "px-3 py-1.5 text-xs font-bold bg-sky-500 text-white transition";
      applyFilters();
    }

    function setTopic(topic) {
      currentTopicFilter = topic;
      isRandomMode = false;
      applyFilters();
    }

    function applyFilters() {
      document.getElementById('randomModeBanner').classList.add('hidden');
      displayedQuestions = globalQuestions.filter(q => {
        if (currentYearKey !== 'Tümü' && String(q.yil) !== currentYearKey) return false;
        const qDers = q.ders || 'Diğer';
        if (currentSubjectFilter !== 'Tümü' && qDers !== currentSubjectFilter) return false;
        if (currentTopicFilter !== 'Tümü' && (q.altKonu || 'Genel') !== currentTopicFilter) return false;
        if (currentStatusFilter === 'starred' && !starredQuestions.includes(q.id)) return false;
        if (currentStatusFilter === 'wrong' && (!userAnswers[q.id] || userAnswers[q.id] === q.dogruCevap)) return false;
        if (searchQuery) {
          const searchStr = searchQuery.toLowerCase();
          const matchText = (q.soruMetni + ' ' + (q.altKonu || '') + ' ' + (q.ders || '') + ' ' + (q.cozum?.dogruCevapNedeni || '')).toLowerCase();
          if (!matchText.includes(searchStr)) return false;
        }
        return true;
      });

      document.getElementById('headerSubtitle').innerText = `${currentYearKey === 'Tümü' ? 'Tüm Yıllar (Karma)' : currentYearKey} • Toplam ${displayedQuestions.length} Soru`;
      renderTopicChips(displayedQuestions);
      renderQuestionsList(displayedQuestions);
      updateStats();
    }

    function pickRandomQuestion() {
      let poolToPick = displayedQuestions.length > 0 ? displayedQuestions : globalQuestions;
      if (poolToPick.length === 0) {
        alert("Havuzda soru bulunmuyor!");
        return;
      }
      const randomIndex = Math.floor(Math.random() * poolToPick.length);
      const chosenQ = poolToPick[randomIndex];
      isRandomMode = true;
      document.getElementById('randomModeBanner').classList.remove('hidden');
      renderQuestionsList([chosenQ]); 
    }

    function exitRandomMode() {
      isRandomMode = false;
      applyFilters(); 
    }

    function renderTopicChips(sourceQuestions) {
      const rawTopics = sourceQuestions.map(q => q.altKonu).filter(Boolean);
      const topics = ['Tümü', ...new Set(rawTopics)].sort();
      const container = document.getElementById('topicChips');
      if (rawTopics.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = topics.map(t => {
        const isActive = t === currentTopicFilter;
        return `
          <button onclick="setTopic('${t}')" class="px-2.5 py-1 rounded-md text-[11px] font-medium transition ${
            isActive 
              ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40' 
              : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800'
          }">
            ${t}
          </button>
        `;
      }).join('');
    }

    function updateStats() {
      if (globalQuestions.length === 0) return;
      let answeredCount = 0;
      let correctCount = 0;
      const statList = isRandomMode ? globalQuestions : displayedQuestions; 

      statList.forEach(q => {
        if (userAnswers[q.id]) {
          answeredCount++;
          if (userAnswers[q.id] === q.dogruCevap) correctCount++;
        }
      });

      const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
      document.getElementById('statProgress').innerText = `${answeredCount} / ${statList.length}`;
      document.getElementById('statAccuracy').innerText = `%${accuracy}`;
    }

    function selectOption(qId, key) {
      if (userAnswers[qId]) return;
      userAnswers[qId] = key;
      saveState();
      
      if (isRandomMode) {
        const q = globalQuestions.find(x => x.id === qId);
        renderQuestionsList([q]);
      } else {
        renderQuestionsList(displayedQuestions);
      }
      updateStats();
    }

    function toggleStar(qId) {
      if (starredQuestions.includes(qId)) {
        starredQuestions = starredQuestions.filter(id => id !== qId);
      } else {
        starredQuestions.push(qId);
      }
      saveState();
      
      if (isRandomMode) {
        const q = globalQuestions.find(x => x.id === qId);
        renderQuestionsList([q]);
      } else {
        renderQuestionsList(displayedQuestions);
      }
    }

    function showEmptyState(msg) {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = `
        <div class="p-8 text-center bg-slate-800/60 rounded-2xl border border-slate-700 flex flex-col items-center">
          <i data-lucide="inbox" class="w-10 h-10 text-sky-400 mb-3"></i>
          <h3 class="text-base font-bold text-white mb-1">Havuz Boş</h3>
          <p class="text-xs text-slate-300 max-w-md leading-relaxed">${msg}</p>
        </div>`;
      lucide.createIcons();
    }

    function renderQuestionsList(list) {
      const container = document.getElementById('questionsContainer');

      if (list.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-slate-800/40 rounded-2xl border border-slate-700/60">
            <i data-lucide="ghost" class="w-10 h-10 mx-auto text-slate-500 mb-2"></i>
            <p class="text-slate-300 font-medium">Bu kriterlere uygun soru bulunamadı.</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      container.innerHTML = list.map(q => {
        const userAnswer = userAnswers[q.id];
        const isAnswered = !!userAnswer;
        const isStarred = starredQuestions.includes(q.id);

        let optionsHtml = Object.entries(q.secenekler).map(([key, text]) => {
          let btnClass = "w-full text-left p-3.5 rounded-xl border text-sm font-medium transition flex items-start gap-3 ";
          let badgeClass = "w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ";
          let explanationHtml = '';

          if (!isAnswered) {
            btnClass += "bg-slate-900/80 hover:bg-slate-700/60 border-slate-700/80 text-slate-200 cursor-pointer";
            badgeClass += "bg-slate-800 text-slate-300 border border-slate-700";
          } else {
            if (key === q.dogruCevap) {
              btnClass += "bg-emerald-950/40 border-emerald-500/80 text-emerald-200 font-semibold";
              badgeClass += "bg-emerald-500 text-white";
            } else if (key === userAnswer && userAnswer !== q.dogruCevap) {
              btnClass += "bg-rose-950/40 border-rose-500/80 text-rose-200";
              badgeClass += "bg-rose-500 text-white";
            } else {
              btnClass += "bg-slate-900/40 border-slate-800 text-slate-500 opacity-60";
              badgeClass += "bg-slate-800 text-slate-600";
            }

            // ŞIKKIN KENDİ AÇIKLAMASINI HEMEN ALTINA BAS
            if (q.cozum) {
              if (key === q.dogruCevap) {
                explanationHtml = `
                  <div class="mt-1.5 ml-2 md:ml-9 p-2.5 bg-emerald-950/30 rounded-lg border border-emerald-500/20 text-xs text-emerald-100/90 leading-relaxed shadow-inner">
                    <span class="font-bold text-emerald-400">Doğru:</span> ${q.cozum.dogruCevapNedeni || 'Açıklama bulunmuyor.'}
                  </div>`;
              } else {
                let celdiriciMetni = (q.cozum.celdiriciler && q.cozum.celdiriciler[key]) ? q.cozum.celdiriciler[key] : 'Bu şık için özel açıklama bulunmuyor.';
                explanationHtml = `
                  <div class="mt-1.5 ml-2 md:ml-9 p-2.5 bg-slate-900/80 rounded-lg border border-slate-700/60 text-xs text-slate-300 leading-relaxed">
                    <span class="font-bold text-rose-400">Yanlış, Çünkü:</span> ${celdiriciMetni}
                  </div>`;
              }
            }
          }

          return `
            <div class="flex flex-col mb-2.5">
              <button onclick="selectOption('${q.id}', '${key}')" ${isAnswered ? 'disabled' : ''} class="${btnClass}">
                <span class="${badgeClass}">${key}</span>
                <span class="flex-1 leading-relaxed">${text}</span>
              </button>
              ${explanationHtml}
            </div>
          `;
        }).join('');

        // KONU ANLATIMI BÖLÜMÜ (Mavi Şık Kutu)
        let solutionHtml = '';
        let anlatimMetni = (q.cozum && q.cozum.konuAnlatimi) ? q.cozum.konuAnlatimi : ((q.cozum && q.cozum.klinikInci) ? q.cozum.klinikInci : null);

        if (isAnswered && anlatimMetni) {
          solutionHtml = `
            <div class="mt-2 pt-4 border-t border-slate-700/60">
              <div class="p-4 bg-sky-950/30 rounded-xl border border-sky-500/30 flex items-start gap-3">
                <div class="p-1.5 bg-sky-500/20 rounded-lg shrink-0 mt-0.5">
                  <i data-lucide="book-open" class="w-4 h-4 text-sky-400"></i>
                </div>
                <div class="text-xs text-sky-100/90 leading-relaxed">
                  <span class="font-bold text-sky-300 block mb-1">Mini Konu Anlatımı</span>
                  ${anlatimMetni}
                </div>
              </div>
            </div>
          `;
        }

        let nextRandomBtn = '';
        if (isAnswered && isRandomMode) {
          nextRandomBtn = `
            <div class="mt-4 text-right">
              <button onclick="pickRandomQuestion()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg transition shadow-lg">
                Sıradaki Rastgele Soruya Geç <i data-lucide="arrow-right" class="w-3 h-3 inline"></i>
              </button>
            </div>
          `;
        }

        return `
          <div class="bg-slate-800/60 p-5 rounded-2xl border border-slate-700/70 shadow-lg relative">
            <div class="flex items-center justify-between gap-3 mb-4">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">
                  <i data-lucide="calendar" class="w-3 h-3 inline mr-0.5"></i> ${q.yil}
                </span>
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-sky-500/20 text-sky-300 border border-sky-500/30">
                  ${q.ders || 'Tıp'}
                </span>
                ${q.altKonu ? `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-700 text-slate-300">${q.altKonu}</span>` : ''}
              </div>
              <button onclick="toggleStar('${q.id}')" class="p-1.5 text-slate-400 hover:text-amber-400 transition">
                <i data-lucide="star" class="w-4 h-4 ${isStarred ? 'text-amber-400 fill-amber-400' : ''}"></i>
              </button>
            </div>

            <p class="text-slate-100 text-sm md:text-base font-medium leading-relaxed mb-5 whitespace-pre-line">
              ${q.soruMetni}
            </p>

            <div class="flex flex-col">
              ${optionsHtml}
            </div>

            ${solutionHtml}
            ${nextRandomBtn}
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      if (!isRandomMode) applyFilters();
    });

    // Başlat
    initApp();
  </script>
</body>
</html>
